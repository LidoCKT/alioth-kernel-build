name: Alioth MIUI BakaSU experiment
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Alioth MIUI baseline]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: alioth-kernel
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex \
            libssl-dev libelf-dev ccache zip unzip curl python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Fetch pinned kernel
        run: |
          git init kernel
          git -C kernel remote add origin https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod.git
          git -C kernel fetch --depth=1 origin 262e587588a28c250c8bb4cc11256840d3c67d8c
          git -C kernel checkout --detach FETCH_HEAD
      - name: Compiler
        run: |
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -o ndk.zip
          unzip -q ndk.zip
          rm ndk.zip
          echo "TOOLCHAIN_PATH=$GITHUB_WORKSPACE/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
      - name: Prepare MIUI-only upstream build
        run: python3 prepare_baseline.py
      - name: Integrate pinned BakaSU manual hooks
        run: python3 integrate_bakasu.py
      - name: Build
        working-directory: kernel
        run: |
          set -o pipefail
          bash build-cloud.sh alioth ksu 2>&1 | tee ../build.log
      - name: Save manifest
        if: always()
        run: |
          mkdir -p artifacts
          cp kernel/Kernel_MIUI_alioth_*.zip artifacts/ 2>/dev/null || true
          cp kernel/out/.config artifacts/kernel.config 2>/dev/null || true
          cp bakasu-integration.patch artifacts/ 2>/dev/null || true
          cp build.log artifacts/ 2>/dev/null || true
          git -C kernel rev-parse HEAD > artifacts/kernel-commit.txt
          git -C kernel/KernelSU rev-parse HEAD > artifacts/root-commit.txt 2>/dev/null || true
          "$TOOLCHAIN_PATH/clang" --version > artifacts/compiler.txt 2>/dev/null || true
          (cd artifacts && sha256sum *.zip > SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alioth-miui-bakasu-experimental-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
